<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dev-only title: production pages get title, meta and JSON-LD from scripts/prerender.mjs -->
    <title>Edoardo Gamurrini</title>
    <!--app-head-->
    <link rel="icon" type="image/png" href="/postsPics/title-img.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!-- Static copy of the contact form so Netlify detects it at deploy time (the real one is rendered by React) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="subject" />
        <textarea name="message"></textarea>
        <input name="bot-field" />
        <input type="hidden" name="notification-email" />
    </form>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
